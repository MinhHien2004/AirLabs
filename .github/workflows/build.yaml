name: airlabs-realtime-flight
on: 
  pull_request:
    types: [closed]
    branches:
      - QA
      - Production
  
jobs:
  build-and-push:
    if: github.event.pull_request.merged == true && github.base_ref == 'QA'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: set_tag
        run: |
          echo "image_tag=v0.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        id: docker_build
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            hienminh1332004/airlabs-realtime-flight:v0.0.${{ github.run_number }}
          cache-from: type=registry,ref=hienminh1332004/airlabs-realtime-flight:buildcache
          cache-to: type=registry,ref=hienminh1332004/airlabs-realtime-flight:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
         
      - name: Verify build
        run: |
          echo "Image pushed successfully!"
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"
          echo "Tag: hienminh1332004/airlabs-realtime-flight:v0.0.${{ github.run_number }}"

      - name: Trigger QA Deployment
        run: |
          echo "Triggering QA deployment via webhook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"event": "deploy", "environment": "qa", "tag": "v0.0.${{ github.run_number }}"}' \
            http://3.88.65.140:9001/deploy/qa)
          
          if [ "$RESPONSE" = "200" ]; then
            echo "Webhook triggered successfully!"
          else
            echo "Webhook returned: $RESPONSE (deployment may still proceed)"
          fi
  tag-production:
    if: github.event.pull_request.merged == true && github.base_ref == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Get Latest QA Tag
        id: get_qa_tag
        run: |
          # Lấy tất cả tags từ Docker Hub và tìm tag v0.0.* mới nhất
          echo "Fetching latest QA tag from Docker Hub..."
          
          LATEST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/hienminh1332004/airlabs-realtime-flight/tags/?page_size=100" \
            | jq -r '.results[].name' \
            | grep '^v0\.0\.' \
            | sort -V \
            | tail -n1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "Error: No QA tag found!"
            exit 1
          fi
          
          echo "Latest QA tag: $LATEST_TAG"
          echo "qa_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Tag QA image for Production
        run: |
          # Sử dụng tag QA mới nhất
          QA_TAG="${{ steps.get_qa_tag.outputs.qa_tag }}"
          QA_IMAGE="hienminh1332004/airlabs-realtime-flight:$QA_TAG"
          PROD_TAG="prod-$QA_TAG"
          
          echo "Using QA image: $QA_IMAGE"
          docker pull $QA_IMAGE
          
          # Tag lại image cho Production (không build mới)
          docker tag $QA_IMAGE hienminh1332004/airlabs-realtime-flight:$PROD_TAG
          docker tag $QA_IMAGE hienminh1332004/airlabs-realtime-flight:prod-latest
          
          # Push production tags
          docker push hienminh1332004/airlabs-realtime-flight:$PROD_TAG
          docker push hienminh1332004/airlabs-realtime-flight:prod-latest
          
          echo "Production image tagged and pushed successfully!"
          echo "  - Source: $QA_IMAGE"
          echo "  - Production: hienminh1332004/airlabs-realtime-flight:$PROD_TAG"
          echo "  - Production: hienminh1332004/airlabs-realtime-flight:prod-latest"

      - name: Trigger Production Deployment
        run: |
          echo "Triggering Production deployment via webhook..."
          QA_TAG="${{ steps.get_qa_tag.outputs.qa_tag }}"
          PROD_TAG="prod-$QA_TAG"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"event": "deploy", "environment": "production", "tag": "'"$PROD_TAG"'"}' \
            http://3.88.65.140:9001/deploy/production)
          
          if [ "$RESPONSE" = "200" ]; then
            echo "Webhook triggered successfully with tag: $PROD_TAG"
          else
            echo "Webhook returned: $RESPONSE (deployment may still proceed)"
          fi
